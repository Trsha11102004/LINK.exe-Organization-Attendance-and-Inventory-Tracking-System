<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Attendance Management System</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>

<body>
    <div class="body-attendance">
    <!-- Navigation Bar -->
    <nav class="nav-bar">
        <div class="nav-links">
          <div class=logo></div>

          <ul>
            <li><a href="index.html">Home</a></li>
            <li><a href="dashboard.html">Dashboard</a></li>
            <li><a href="attendance.html" class="active">Attendance</a></li>
            <li><a href="equipments inventory.html">Equipments</a></li>
            <li><a href="reports.html">Reports</a></li>
            <li><a href="members.html" >Members</a></li>
          </ul>
        </div>
        
        <button class="logout-btn" onclick="alert('Logout functionality')">
            <i class="fas fa-sign-out-alt"></i> Logout
        </button>
    </nav>

    <div class="container">
        <!-- Header -->
        <header>
            <div class="header-attendance">
            <h1>Attendance</h1>
            <button class="add-event-btn" onclick="openAddEventModal()">
                <i class="fas fa-plus"></i> Add Event
            </button>
            </div>
        </header>

        <!-- Overall Attendance Table -->
        <div class="activity-card">
            <h2>Overall Attendance Table</h2>
            <div class="table-wrapper">
                <table id="attendanceTable">
                    <thead>
                        <tr id="tableHeader">
                            <th>Member Name</th>
                        </tr>
                    </thead>
                    <tbody id="tableBody">
                    </tbody>
                </table>
            </div>
        </div>

        <!-- Event Details Section -->
        <div class="events-section">
            <div class="events-header">
                <h2>Event Details</h2>
                <div class="filter-buttons">
                    <button class="filter-btn active" data-pillar="all" onclick="filterEvents('all')">All</button>
                    <button class="filter-btn" data-pillar="Extensions" onclick="filterEvents('Extensions')">Extensions</button>
                    <button class="filter-btn" data-pillar="Training" onclick="filterEvents('Training')">Training</button>
                    <button class="filter-btn" data-pillar="Programs" onclick="filterEvents('Programs')">Programs</button>
                    <button class="filter-btn" data-pillar="IGP" onclick="filterEvents('IGP')">IGP</button>
                </div>
            </div>
            <div class="event-grid" id="eventGrid">
            </div>
        </div>
    </div>

    <!-- Add Event Modal -->
    <div id="addEventModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Add New Event</h2>
                <span class="close" onclick="closeAddEventModal()">&times;</span>
            </div>
            <div class="modal-body">
                <form id="addEventForm" onsubmit="addEvent(event)">
                    <div class="form-group">
                        <label for="eventName">Event Name *</label>
                        <input type="text" id="eventName" required>
                    </div>
                    <div class="form-group">
                        <label for="eventPillar">Pillar *</label>
                        <select id="eventPillar" required>
                            <option value="">Select Pillar</option>
                            <option value="Extensions">Extensions</option>
                            <option value="Training">Training</option>
                            <option value="Programs">Programs</option>
                            <option value="IGP">IGP</option>
                        </select>
                    </div>
                    
                    <div class="checkbox-group">
                        <input type="checkbox" id="multiDayEvent" onchange="toggleDateRange()">
                        <label for="multiDayEvent">Multi-day Event</label>
                    </div>

                    <div id="singleDate">
                        <div class="form-group">
                            <label for="eventDate">Event Date *</label>
                            <input type="date" id="eventDate" required>
                        </div>
                    </div>

                    <div id="dateRange" class="date-range">
                        <div class="form-group">
                            <label for="eventStartDate">First Day *</label>
                            <input type="date" id="eventStartDate">
                        </div>
                        <div class="form-group">
                            <label for="eventEndDate">Last Day *</label>
                            <input type="date" id="eventEndDate">
                        </div>
                    </div>

                    <button type="submit" class="submit-btn">Create Event</button>
                </form>
            </div>
        </div>
    </div>

    <!-- Add Attendee Modal -->
    <div id="addAttendeeModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Add Attendee</h2>
                <span class="close" onclick="closeAddAttendeeModal()">&times;</span>
            </div>
            <div class="modal-body">
                <form id="addAttendeeForm" onsubmit="addAttendee(event)">
                    <div class="form-group">
                        <label for="attendeeName">Name *</label>
                        <input type="text" id="attendeeName" required>
                    </div>
                    <div class="form-group">
                        <label for="attendeeRole">Role *</label>
                        <input type="text" id="attendeeRole" placeholder="e.g., Volunteer, Organizer, Team Leader" required>
                    </div>
                    <div class="form-group">
                        <label for="dutyDate">Duty Date *</label>
                        <input type="date" id="dutyDate" required>
                    </div>
                    <button type="submit" class="submit-btn">Add Attendee</button>
                </form>
            </div>
        </div>
    </div>
    </div>

    <script>
        // Data storage
        let events = [];
        let currentEventId = null;
        let currentFilter = 'all';

        // Pillar colors
        const pillarColors = {
            'Extensions': '#03508C',
            'Training': '#4CBBDE',
            'Programs': '#9FDCE0',
            'IGP': '#667eea'
        };

        // Initialize with sample data
        function initializeSampleData() {
            events = [
                {
                    id: 1,
                    name: 'Hinampang 2025',
                    pillar: 'Extensions',
                    startDate: '2025-03-15',
                    endDate: '2025-03-17',
                    attendees: [
                        { name: 'Bryan Santos', role: 'Team Leader', dutyDate: '2025-03-15' },
                        { name: 'Kaye Francisco', role: 'Volunteer', dutyDate: '2025-03-16' },
                        { name: 'Ana Reyes', role: 'Organizer', dutyDate: '2025-03-15' },
                        { name: 'Carlos Mendoza', role: 'Volunteer', dutyDate: '2025-03-17' },
                        { name: 'Maria Cruz', role: 'Coordinator', dutyDate: '2025-03-15' },
                        { name: 'Lea Gonzales', role: 'Volunteer', dutyDate: '2025-03-16' }
                    ]
                },
                {
                    id: 2,
                    name: 'Assembly 2024',
                    pillar: 'Training',
                    startDate: '2024-11-20',
                    endDate: '2024-11-20',
                    attendees: [
                        { name: 'Bryan Santos', role: 'Speaker', dutyDate: '2024-11-20' },
                        { name: 'Miguel Torres', role: 'Participant', dutyDate: '2024-11-20' },
                        { name: 'Ana Reyes', role: 'Moderator', dutyDate: '2024-11-20' },
                        { name: 'Maria Cruz', role: 'Organizer', dutyDate: '2024-11-20' },
                        { name: 'Jose Villanueva', role: 'Participant', dutyDate: '2024-11-20' },
                        { name: 'Lea Gonzales', role: 'Participant', dutyDate: '2024-11-20' }
                    ]
                },
                {
                    id: 3,
                    name: 'Workshop Series',
                    pillar: 'Programs',
                    startDate: '2025-01-10',
                    endDate: '2025-01-12',
                    attendees: [
                        { name: 'Kaye Francisco', role: 'Facilitator', dutyDate: '2025-01-10' },
                        { name: 'Miguel Torres', role: 'Workshop Leader', dutyDate: '2025-01-11' },
                        { name: 'Ana Reyes', role: 'Coordinator', dutyDate: '2025-01-10' },
                        { name: 'Maria Cruz', role: 'Assistant', dutyDate: '2025-01-11' },
                        { name: 'Jose Villanueva', role: 'Participant', dutyDate: '2025-01-12' }
                    ]
                },
                {
                    id: 4,
                    name: 'IGP Summit',
                    pillar: 'IGP',
                    startDate: '2025-02-05',
                    endDate: '2025-02-05',
                    attendees: [
                        { name: 'Bryan Santos', role: 'Representative', dutyDate: '2025-02-05' },
                        { name: 'Kaye Francisco', role: 'Delegate', dutyDate: '2025-02-05' },
                        { name: 'Miguel Torres', role: 'Participant', dutyDate: '2025-02-05' },
                        { name: 'Carlos Mendoza', role: 'Volunteer', dutyDate: '2025-02-05' },
                        { name: 'Maria Cruz', role: 'Coordinator', dutyDate: '2025-02-05' },
                        { name: 'Lea Gonzales', role: 'Delegate', dutyDate: '2025-02-05' }
                    ]
                }
            ];
            renderAll();
        }

        // Get all unique members
        function getAllMembers() {
            const memberSet = new Set();
            events.forEach(event => {
                event.attendees.forEach(attendee => {
                    memberSet.add(attendee.name);
                });
            });
            return Array.from(memberSet).sort();
        }

        // Check if member attended event
        function memberAttended(memberName, eventId) {
            const event = events.find(e => e.id === eventId);
            if (!event) return false;
            return event.attendees.some(a => a.name === memberName);
        }

        // Render Overall Attendance Table
        function renderAttendanceTable() {
            const header = document.getElementById('tableHeader');
            const body = document.getElementById('tableBody');

            // Build header
            let headerHTML = '<th>Member Name</th>';
            events.forEach(event => {
                headerHTML += `<th>${event.name}</th>`;
            });
            header.innerHTML = headerHTML;

            // Build body
            const members = getAllMembers();
            if (members.length === 0) {
                body.innerHTML = `
                    <tr>
                        <td colspan="${events.length + 1}" style="text-align: center; padding: 40px; color: #666;">
                            <i class="fas fa-users" style="font-size: 3em; display: block; margin-bottom: 10px; color: #ddd;"></i>
                            No members yet. Add events and attendees to get started.
                        </td>
                    </tr>
                `;
                return;
            }

            let bodyHTML = '';
            members.forEach(member => {
                bodyHTML += `<tr><td>${member}</td>`;
                events.forEach(event => {
                    const attended = memberAttended(member, event.id);
                    bodyHTML += `
                        <td class="td-center">
                            <span class="${attended ? 'present' : 'absent'}">
                                ${attended ? '✓' : '✗'}
                            </span>
                        </td>
                    `;
                });
                bodyHTML += '</tr>';
            });
            body.innerHTML = bodyHTML;
        }

        // Filter events by pillar
        function filterEvents(pillar) {
            currentFilter = pillar;
            
            // Update active button
            document.querySelectorAll('.filter-btn').forEach(btn => {
                btn.classList.remove('active');
                if (btn.getAttribute('data-pillar') === pillar) {
                    btn.classList.add('active');
                }
            });
            
            renderEventCards(pillar);
        }

        // Render Event Cards
        function renderEventCards(filterPillar = 'all') {
            const grid = document.getElementById('eventGrid');
            
            // Filter events based on selected pillar
            const filteredEvents = filterPillar === 'all' 
                ? events 
                : events.filter(event => event.pillar === filterPillar);
            
            if (events.length === 0) {
                grid.innerHTML = `
                    <div class="empty-state" style="grid-column: 1/-1;">
                        <i class="fas fa-calendar-alt"></i>
                        <p>No events yet. Click "Add Event" to create your first event.</p>
                    </div>
                `;
                return;
            }

            if (filteredEvents.length === 0) {
                grid.innerHTML = `
                    <div class="empty-state" style="grid-column: 1/-1;">
                        <i class="fas fa-filter"></i>
                        <p>No events found for the selected pillar.</p>
                    </div>
                `;
                return;
            }

            grid.innerHTML = filteredEvents.map(event => `
                <div class="event-container">
                    <div class="event-header" style="border-left-color: ${pillarColors[event.pillar]};">
                        <div class="event-header-content" onclick="toggleEvent(${event.id})">
                            <div class="event-title">${event.name}</div>
                            <span class="pillar-badge" style="background: ${pillarColors[event.pillar]}; ${event.pillar === 'Programs' ? 'color: #112653;' : ''}">${event.pillar}</span>
                            <p class="event-date">
                                <i class="fas fa-calendar"></i>
                                ${formatDate(event.startDate)}${event.endDate !== event.startDate ? ' - ' + formatDate(event.endDate) : ''}
                            </p>
                            <p class="event-info">
                                <i class="fas fa-users"></i> ${event.attendees.length} attendees
                            </p>
                        </div>
                        <div class="event-actions">
                            <button class="delete-event-btn" onclick="deleteEvent(${event.id}); event.stopPropagation();" title="Delete Event">
                                <i class="fas fa-trash"></i>
                            </button>
                        </div>
                    </div>
                    <div class="event-content" id="event-${event.id}">
                        ${event.attendees.length === 0 ? `
                            <div class="empty-state">
                                <p style="font-size: 0.9em;">No attendees yet.</p>
                            </div>
                        ` : `
                            <ul class="attendee-list">
                                ${event.attendees.map((attendee, index) => `
                                    <li class="attendee-item">
                                        <div class="attendee-info">
                                            <div class="attendee-name">${attendee.name}</div>
                                            <div class="attendee-details">
                                                Duty Date: ${formatDate(attendee.dutyDate)} | Role: ${attendee.role}
                                            </div>
                                        </div>
                                        <button class="delete-btn" onclick="deleteAttendee(${event.id}, ${index})">
                                            <i class="fas fa-trash"></i>
                                        </button>
                                    </li>
                                `).join('')}
                            </ul>
                        `}
                        <button class="add-attendee-btn" onclick="openAddAttendeeModal(${event.id})">
                            <i class="fas fa-plus"></i> Add Attendee
                        </button>
                    </div>
                </div>
            `).join('');
        }

        // Render all
        function renderAll() {
            renderAttendanceTable();
            renderEventCards(currentFilter);
        }

        // Format date
        function formatDate(dateStr) {
            const options = { year: 'numeric', month: 'long', day: 'numeric' };
            return new Date(dateStr).toLocaleDateString('en-US', options);
        }

        // Toggle event expansion
        function toggleEvent(eventId) {
            const content = document.getElementById(`event-${eventId}`);
            content.classList.toggle('active');
        }

        // Toggle date range
        function toggleDateRange() {
            const checkbox = document.getElementById('multiDayEvent');
            const singleDate = document.getElementById('singleDate');
            const dateRange = document.getElementById('dateRange');
            
            if (checkbox.checked) {
                singleDate.style.display = 'none';
                dateRange.classList.add('active');
                document.getElementById('eventDate').removeAttribute('required');
                document.getElementById('eventStartDate').setAttribute('required', 'required');
                document.getElementById('eventEndDate').setAttribute('required', 'required');
            } else {
                singleDate.style.display = 'block';
                dateRange.classList.remove('active');
                document.getElementById('eventDate').setAttribute('required', 'required');
                document.getElementById('eventStartDate').removeAttribute('required');
                document.getElementById('eventEndDate').removeAttribute('required');
            }
        }

        // Modal functions
        function openAddEventModal() {
            document.getElementById('addEventModal').style.display = 'block';
        }

        function closeAddEventModal() {
            document.getElementById('addEventModal').style.display = 'none';
            document.getElementById('addEventForm').reset();
            document.getElementById('multiDayEvent').checked = false;
            toggleDateRange();
        }

        function openAddAttendeeModal(eventId) {
            currentEventId = eventId;
            document.getElementById('addAttendeeModal').style.display = 'block';
        }

        function closeAddAttendeeModal() {
            document.getElementById('addAttendeeModal').style.display = 'none';
            document.getElementById('addAttendeeForm').reset();
            currentEventId = null;
        }

        // Add event
        function addEvent(e) {
            e.preventDefault();
            
            const multiDay = document.getElementById('multiDayEvent').checked;
            let startDate, endDate;
            
            if (multiDay) {
                startDate = document.getElementById('eventStartDate').value;
                endDate = document.getElementById('eventEndDate').value;
            } else {
                startDate = document.getElementById('eventDate').value;
                endDate = startDate;
            }

            const newEvent = {
                id: Date.now(),
                name: document.getElementById('eventName').value,
                pillar: document.getElementById('eventPillar').value,
                startDate: startDate,
                endDate: endDate,
                attendees: []
            };

            events.push(newEvent);
            renderAll();
            closeAddEventModal();
        }

        // Add attendee
        function addAttendee(e) {
            e.preventDefault();
            
            const event = events.find(ev => ev.id === currentEventId);
            if (!event) return;

            const newAttendee = {
                name: document.getElementById('attendeeName').value,
                role: document.getElementById('attendeeRole').value,
                dutyDate: document.getElementById('dutyDate').value
            };

            event.attendees.push(newAttendee);
            renderAll();
            closeAddAttendeeModal();
        }

        // Delete event
        function deleteEvent(eventId) {
            const event = events.find(e => e.id === eventId);
            if (!event) return;
            
            if (confirm(`Are you sure you want to delete the event "${event.name}"? This will remove all attendees associated with this event.`)) {
                events = events.filter(e => e.id !== eventId);
                renderAll();
            }
        }

        // Delete attendee
        function deleteAttendee(eventId, attendeeIndex) {
            if (confirm('Are you sure you want to remove this attendee?')) {
                const event = events.find(e => e.id === eventId);
                if (event) {
                    event.attendees.splice(attendeeIndex, 1);
                    renderAll();
                }
            }
        }

        // Close modals when clicking outside
        window.onclick = function(event) {
            if (event.target.classList.contains('modal')) {
                event.target.style.display = 'none';
            }
        }

        // Initialize
        initializeSampleData();
    </script>
</body>
</html>
