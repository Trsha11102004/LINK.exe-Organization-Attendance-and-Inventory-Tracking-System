<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Equipment Inventory System</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #DDEDF2 0%, #3b84be 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }


        /* Header */
        header {
            background: white;
            padding: 25px 30px;
            border-radius: 15px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.1);
            margin-bottom: 30px;
            margin-top: 70px;
        }

        h1 {
            color: #03508C;
            font-size: 2em;
        }

        /* Summary Table */
        .summary-card {
            background: white;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.1);
            margin-bottom: 30px;
        }

        .table-wrapper {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background: white;
        }

        th, td {
            padding: 15px;
            text-align: left;
            border-bottom: 1px solid #f0f0f0;
        }

        th {
            background: #f9fafb;
            color: #03508C;
            font-weight: 600;
            position: sticky;
            top: 0;
            z-index: 10;
        }

        td {
            color: #333;
        }

        tbody tr:hover {
            background: #f9fafb;
        }

        .status-badge {
            display: inline-block;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 0.85em;
            font-weight: 600;
        }

        .status-available {
            background: #d1fae5;
            color: #065f46;
        }

        .status-borrowed {
            background: #fee2e2;
            color: #991b1b;
        }

        /* Action Buttons */
        .action-buttons {
            display: flex;
            gap: 15px;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }

        .btn {
            padding: 12px 30px;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: all 0.3s ease;
            font-size: 1em;
        }

        .btn-primary {
            background: #03508C;
            color: white;
        }

        .btn-primary:hover {
            background: #024070;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(3, 80, 140, 0.3);
        }

        .btn-secondary {
            background: white;
            color: #03508C;
            border: 2px solid #03508C;
        }

        .btn-secondary:hover {
            background: #f0f4f8;
            transform: translateY(-2px);
        }

        /* Modal Styles */
        .modal {
            display: none;
            position: fixed;
            z-index: 2000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0,0,0,0.5);
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .modal-content {
            background-color: white;
            margin: 5% auto;
            padding: 0;
            border-radius: 15px;
            width: 90%;
            max-width: 600px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.3);
            animation: slideDownModal 0.3s ease;
            max-height: 85vh;
            overflow-y: auto;
        }

        @keyframes slideDownModal {
            from {
                transform: translateY(-50px);
                opacity: 0;
            }
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        .modal-header {
            background: linear-gradient(135deg, #03508C 0%, #024070 100%);
            color: white;
            padding: 20px 30px;
            border-radius: 15px 15px 0 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 10;
        }

        .modal-header h2 {
            font-size: 1.5em;
            margin: 0;
        }

        .close {
            color: white;
            font-size: 28px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .close:hover {
            transform: scale(1.2);
        }

        .modal-body {
            padding: 30px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 600;
        }

        .form-group input,
        .form-group select,
        .form-group textarea {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 1em;
            transition: all 0.3s ease;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        .form-group textarea {
            resize: vertical;
            min-height: 80px;
        }

        .form-group input:focus,
        .form-group select:focus,
        .form-group textarea:focus {
            outline: none;
            border-color: #03508C;
        }

        .form-group input:disabled {
            background: #f0f0f0;
            cursor: not-allowed;
        }

        .submit-btn {
            background: #03508C;
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
            font-size: 1em;
            transition: all 0.3s ease;
        }

        .submit-btn:hover {
            background: #024070;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }

        /* Borrowed Items List */
        .borrowed-section {
            background: white;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.1);
        }

        .borrowed-section h2 {
            color: #03508C;
            margin-bottom: 20px;
            font-size: 1.6em;
        }

        .borrowed-item {
            padding: 15px;
            background: #f9fafb;
            border-radius: 8px;
            margin-bottom: 15px;
            border-left: 4px solid #991b1b;
        }

        .borrowed-item-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        .borrowed-item-name {
            font-weight: 700;
            color: #112653;
            font-size: 1.1em;
        }

        .return-btn {
            background: #059669;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .return-btn:hover {
            background: #047857;
        }

        .borrowed-details {
            font-size: 0.9em;
            color: #666;
            line-height: 1.6;
        }

        .empty-state {
            text-align: center;
            padding: 40px;
            color: #666;
        }

        .empty-state i {
            font-size: 4em;
            color: #ddd;
            margin-bottom: 15px;
        }

        /* Action cell */
        .action-cell {
            display: flex;
            gap: 8px;
        }

        .table-btn {
            padding: 6px 12px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.85em;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .btn-edit {
            background: #f59e0b;
            color: white;
        }

        .btn-edit:hover {
            background: #d97706;
        }

        .btn-delete {
            background: #dc2626;
            color: white;
        }

        .btn-delete:hover {
            background: #b91c1c;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .nav-bar {
                padding: 10px 15px;
            }

            .action-buttons {
                flex-direction: column;
            }

            .btn {
                width: 100%;
                justify-content: center;
            }

            .modal-content {
                width: 95%;
                margin: 10% auto;
            }

            .table-wrapper {
                overflow-x: scroll;
            }
        }
    </style>
</head>
<body>
    <!-- Navigation Bar -->
     <div>
    <nav class="nav-bar">
        <div class="nav-links">
          <a href="index.html">Home</a>
          <a href="dashboard.html">Dashboard</a>
          <a href="attendance.html">Attendance</a>
          <a href="equipments inventory.html">Equipments</a>
          <a href="reports.html">Reports</a>
          <!--to discuss last page-->
          <a href="members.html">Members</a>
        </div>
        <button class="logout-btn" onclick="alert('Logout functionality')">
            <i class="fas fa-sign-out-alt"></i> Logout
        </button>
    </nav>

    <div class="container">
        <!-- Header -->
        <header>
            <h1><i class="fas fa-boxes"></i> Equipment Inventory</h1>
        </header>

        <!-- Summary Table -->
        <div class="summary-card">
            <div class="table-wrapper">
                <table id="equipmentTable">
                    <thead>
                        <tr>
                            <th>Equipment</th>
                            <th>Owner</th>
                            <th>Status</th>
                            <th>Borrowed Date</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="tableBody">
                    </tbody>
                </table>
            </div>
        </div>

        <!-- Action Buttons -->
        <div class="action-buttons">
            <button class="btn btn-primary" onclick="openAddEquipmentModal()">
                <i class="fas fa-plus"></i> Add Equipment
            </button>
            <button class="btn btn-secondary" onclick="toggleBorrowedView()">
                <i class="fas fa-list"></i> View Borrowed
            </button>
        </div>

        <!-- Borrowed Items Section -->
        <div id="borrowedSection" class="borrowed-section" style="display: none;">
            <h2><i class="fas fa-clipboard-list"></i> Currently Borrowed Equipment</h2>
            <div id="borrowedList"></div>
        </div>
    </div>

    <!-- Add Equipment Modal -->
    <div id="addEquipmentModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="equipmentModalTitle"><i class="fas fa-plus-circle"></i> Add New Equipment</h2>
                <span class="close" onclick="closeAddEquipmentModal()">&times;</span>
            </div>
            <div class="modal-body">
                <form id="addEquipmentForm" onsubmit="saveEquipment(event)">
                    <input type="hidden" id="equipmentId">
                    <div class="form-group">
                        <label for="equipmentName">Equipment Name *</label>
                        <input type="text" id="equipmentName" placeholder="e.g., DSLR Camera, Tripod" required>
                    </div>
                    <div class="form-group">
                        <label for="equipmentOwner">Owner *</label>
                        <input type="text" id="equipmentOwner" placeholder="e.g., Media Team, Tech Dept" required>
                    </div>
                    <button type="submit" class="submit-btn" id="equipmentSubmitBtn">Add Equipment</button>
                </form>
            </div>
        </div>
    </div>

    <!-- Borrow Equipment Modal -->
    <div id="borrowModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2><i class="fas fa-hand-holding"></i> Borrow Equipment</h2>
                <span class="close" onclick="closeBorrowModal()">&times;</span>
            </div>
            <div class="modal-body">
                <form id="borrowForm" onsubmit="borrowEquipment(event)">
                    <div class="form-group">
                        <label for="borrowEquipmentName">Equipment *</label>
                        <input type="text" id="borrowEquipmentName" disabled>
                        <input type="hidden" id="borrowEquipmentId">
                    </div>
                    <div class="form-group">
                        <label for="borrowerName">Borrower Name *</label>
                        <input type="text" id="borrowerName" placeholder="Enter member's name" required>
                    </div>
                    <div class="form-group">
                        <label for="eventName">Event Name / Purpose *</label>
                        <input type="text" id="eventName" placeholder="e.g., Hinampang Event, Photoshoot" required>
                    </div>
                    <div class="form-group">
                        <label for="dateOfUse">Date of Use *</label>
                        <input type="date" id="dateOfUse" required>
                    </div>
                    <div class="form-group">
                        <label for="estimatedReturn">Estimated Return Date *</label>
                        <input type="date" id="estimatedReturn" required>
                    </div>
                    <div class="form-group">
                        <label for="borrowNotes">Notes (optional)</label>
                        <textarea id="borrowNotes" placeholder="Additional details, condition notes, special instructions..."></textarea>
                    </div>
                    <button type="submit" class="submit-btn">Confirm Borrow</button>
                </form>
            </div>
        </div>
    </div>

    <script>
        // Data storage
        let equipment = [];
        let borrowedView = false;
        let editMode = false;
        let currentEditId = null;

        // Initialize with sample data
        function initializeSampleData() {
            equipment = [
                {
                    id: 1,
                    name: 'DSLR',
                    owner: 'Media Team',
                    status: 'borrowed',
                    borrowedDate: '2025-11-15',
                    borrower: 'Bryan Santos',
                    eventName: 'Hinampang Documentation',
                    dateOfUse: '2025-11-15',
                    estimatedReturn: '2025-11-20',
                    notes: 'Handle with care'
                },
                {
                    id: 2,
                    name: 'Tripod',
                    owner: 'Tech Dept',
                    status: 'available',
                    borrowedDate: null
                },
                {
                    id: 3,
                    name: 'Mic Set',
                    owner: 'Events Team',
                    status: 'available',
                    borrowedDate: null
                },
                {
                    id: 4,
                    name: 'Drone',
                    owner: 'Production',
                    status: 'borrowed',
                    borrowedDate: '2025-11-17',
                    borrower: 'Kaye Francisco',
                    eventName: 'Aerial Coverage',
                    dateOfUse: '2025-11-17',
                    estimatedReturn: '2025-11-22',
                    notes: 'Check battery levels before use'
                }
            ];
            renderTable();
        }

        // Render main table
        function renderTable() {
            const tbody = document.getElementById('tableBody');
            
            if (equipment.length === 0) {
                tbody.innerHTML = `
                    <tr>
                        <td colspan="5" class="empty-state">
                            <i class="fas fa-box-open"></i>
                            <p>No equipment yet. Click "Add Equipment" to get started.</p>
                        </td>
                    </tr>
                `;
                return;
            }

            tbody.innerHTML = equipment.map(item => `
                <tr>
                    <td><strong>${item.name}</strong></td>
                    <td>${item.owner}</td>
                    <td>
                        <span class="status-badge ${item.status === 'available' ? 'status-available' : 'status-borrowed'}">
                            ${item.status === 'available' ? 'Available' : 'Borrowed'}
                        </span>
                    </td>
                    <td>${item.borrowedDate ? formatDate(item.borrowedDate) : '–'}</td>
                    <td class="action-cell">
                        ${item.status === 'available' ? `
                            <button class="table-btn btn-edit" onclick="openBorrowModalForItem(${item.id})" style="background: #03508C;">
                                <i class="fas fa-hand-holding"></i> Borrow
                            </button>
                        ` : ''}
                        <button class="table-btn btn-edit" onclick="editEquipment(${item.id})">
                            <i class="fas fa-edit"></i> Edit
                        </button>
                        <button class="table-btn btn-delete" onclick="deleteEquipment(${item.id})">
                            <i class="fas fa-trash"></i> Delete
                        </button>
                    </td>
                </tr>
            `).join('');
        }

        // Format date
        function formatDate(dateStr) {
            const options = { year: 'numeric', month: 'short', day: 'numeric' };
            return new Date(dateStr).toLocaleDateString('en-US', options);
        }

        // Open Add Equipment Modal
        function openAddEquipmentModal() {
            editMode = false;
            currentEditId = null;
            document.getElementById('equipmentModalTitle').innerHTML = '<i class="fas fa-plus-circle"></i> Add New Equipment';
            document.getElementById('equipmentSubmitBtn').textContent = 'Add Equipment';
            document.getElementById('addEquipmentModal').style.display = 'block';
        }

        function closeAddEquipmentModal() {
            document.getElementById('addEquipmentModal').style.display = 'none';
            document.getElementById('addEquipmentForm').reset();
            document.getElementById('equipmentId').value = '';
            editMode = false;
            currentEditId = null;
        }

        // Save Equipment (Add or Edit)
        function saveEquipment(e) {
            e.preventDefault();
            
            const name = document.getElementById('equipmentName').value;
            const owner = document.getElementById('equipmentOwner').value;
            const id = document.getElementById('equipmentId').value;

            if (editMode && id) {
                // Edit existing equipment
                const item = equipment.find(eq => eq.id === parseInt(id));
                if (item) {
                    item.name = name;
                    item.owner = owner;
                }
            } else {
                // Add new equipment
                const newEquipment = {
                    id: Date.now(),
                    name: name,
                    owner: owner,
                    status: 'available',
                    borrowedDate: null
                };
                equipment.push(newEquipment);
            }

            renderTable();
            closeAddEquipmentModal();
        }

        // Edit Equipment
        function editEquipment(itemId) {
            const item = equipment.find(eq => eq.id === itemId);
            if (!item) return;

            editMode = true;
            currentEditId = itemId;

            document.getElementById('equipmentModalTitle').innerHTML = '<i class="fas fa-edit"></i> Edit Equipment';
            document.getElementById('equipmentSubmitBtn').textContent = 'Update Equipment';
            document.getElementById('equipmentId').value = itemId;
            document.getElementById('equipmentName').value = item.name;
            document.getElementById('equipmentOwner').value = item.owner;
            
            document.getElementById('addEquipmentModal').style.display = 'block';
        }

        // Delete Equipment
        function deleteEquipment(itemId) {
            const item = equipment.find(eq => eq.id === itemId);
            if (!item) return;

            if (item.status === 'borrowed') {
                alert('Cannot delete equipment that is currently borrowed. Please return it first.');
                return;
            }

            if (confirm(`Are you sure you want to delete "${item.name}"?`)) {
                equipment = equipment.filter(eq => eq.id !== itemId);
                renderTable();
                renderBorrowedList();
            }
        }

        // Open Borrow Modal for specific item
        function openBorrowModalForItem(itemId) {
            const item = equipment.find(eq => eq.id === itemId);
            if (!item || item.status !== 'available') return;

            document.getElementById('borrowEquipmentName').value = `${item.name} (${item.owner})`;
            document.getElementById('borrowEquipmentId').value = itemId;
            document.getElementById('borrowModal').style.display = 'block';
        }

        function closeBorrowModal() {
            document.getElementById('borrowModal').style.display = 'none';
            document.getElementById('borrowForm').reset();
        }

        // Borrow Equipment
        function borrowEquipment(e) {
            e.preventDefault();
            
            const itemId = parseInt(document.getElementById('borrowEquipmentId').value);
            const item = equipment.find(eq => eq.id === itemId);
            
            if (!item) {
                alert('Equipment not found');
                return;
            }

            const today = new Date().toISOString().split('T')[0];
            
            item.status = 'borrowed';
            item.borrowedDate = today;
            item.borrower = document.getElementById('borrowerName').value;
            item.eventName = document.getElementById('eventName').value;
            item.dateOfUse = document.getElementById('dateOfUse').value;
            item.estimatedReturn = document.getElementById('estimatedReturn').value;
            item.notes = document.getElementById('borrowNotes').value;

            renderTable();
            renderBorrowedList();
            closeBorrowModal();
        }

        // Toggle Borrowed View
        function toggleBorrowedView() {
            borrowedView = !borrowedView;
            const section = document.getElementById('borrowedSection');
            
            if (borrowedView) {
                section.style.display = 'block';
                renderBorrowedList();
            } else {
                section.style.display = 'none';
            }
        }

        // Render Borrowed List
        function renderBorrowedList() {
            const list = document.getElementById('borrowedList');
            const borrowed = equipment.filter(item => item.status === 'borrowed');
            
            if (borrowed.length === 0) {
                list.innerHTML = `
                    <div class="empty-state">
                        <i class="fas fa-check-circle"></i>
                        <p>No equipment currently borrowed.</p>
                    </div>
                `;
                return;
            }

            list.innerHTML = borrowed.map(item => `
                <div class="borrowed-item">
                    <div class="borrowed-item-header">
                        <div class="borrowed-item-name">
                            <i class="fas fa-box"></i> ${item.name}
                        </div>
                        <button class="return-btn" onclick="returnEquipment(${item.id})">
                            <i class="fas fa-undo"></i> Return
                        </button>
                    </div>
                    <div class="borrowed-details">
                        <div><strong>Owner:</strong> ${item.owner}</div>
                        <div><strong>Borrower:</strong> ${item.borrower}</div>
                        <div><strong>Event:</strong> ${item.eventName}</div>
                        <div><strong>Borrowed Date:</strong> ${formatDate(item.borrowedDate)}</div>
                        <div><strong>Date of Use:</strong> ${formatDate(item.dateOfUse)}</div>
                        <div><strong>Expected Return:</strong> ${formatDate(item.estimatedReturn)}</div>
                        ${item.notes ? `<div><strong>Notes:</strong> ${item.notes}</div>` : ''}
                    </div>
                </div>
            `).join('');
        }

        // Return Equipment
        function returnEquipment(itemId) {
            if (confirm('Mark this equipment as returned?')) {
                const item = equipment.find(eq => eq.id === itemId);
                if (item) {
                    item.status = 'available';
                    item.borrowedDate = null;
                    delete item.borrower;
                    delete item.eventName;
                    delete item.dateOfUse;
                    delete item.estimatedReturn;
                    delete item.notes;
                    
                    renderTable();
                    renderBorrowedList();
                }
            }
        }

        // Close modals when clicking outside
        window.onclick = function(event) {
            if (event.target.classList.contains('modal')) {
                event.target.style.display = 'none';
            }
        }

        // Initialize
        initializeSampleData();
    </script>
</body>
</html>
