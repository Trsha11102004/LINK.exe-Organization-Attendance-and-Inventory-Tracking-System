<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - LINK.exe</title>
    <link rel="stylesheet" href="login.css">
    <script type="module" src="login.js"></script>
</head>
<body>
    <div class="login-container">
        <div class="welcome-side">
            <div class="welcome-content">
                <h1>WELCOME!</h1>
                <p>Upholding Excellence, serving the community</p>
                <div class="mascot-container">
                    <img src="Images/Lex.png" alt="Mascot Character" class="mascot">
                </div>
            </div>
        </div>

        <div class="form-side">
            <div class="form-wrapper">
                <h2>LOGIN</h2>
                <p class="subtitle">Login your account to get started</p>

                <form id="loginForm">
                    <div class="input-group">
                        <input type="text" placeholder="Email" id="enteremail" required>
                    </div>

                    <div class="input-group">
                        <input type="password" placeholder="Password" id="enterpassword" required>
                        <span class="show-password" id="togglePassword">SHOW</span>
                    </div>

                    <div class="form-options">
                        <label class="remember-me">
                            <input type="checkbox"> <span>Remember me</span>
                        </label>
                        <a href="#" class="forgot-link" id="forgotPasswordBtn">Forgot Password?</a>
                    </div>

                    <button type="submit" class="btn-login" id="btn-login">Login</button>
                    <button type="button" class="btn-cancel" onclick="window.location.href='index.html'">Cancel</button>
                </form>

                <p class="signup-text">Don't have an account? <a href="signup.html">Sign Up</a></p>
            </div>
        </div>
    </div>
</body>
</html>
